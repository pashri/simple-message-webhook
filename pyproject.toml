[project]
name = "simple-message-webhook"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aws-lambda-powertools>=3.0",
    "boto3>=1.35",
    "fastapi>=0.115",
    "mangum>=0.19",
    "pynamodb>=6.0",
    "pynamodb-attributes>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-env>=1.1",
    "moto[dynamodb,ssm]>=5.0",
    "mypy>=1.13",
    "pylint>=3.3",
    "isort>=5.13",
    "numpydoc>=1.8",
    "boto3-stubs[ssm]>=1.35",
    "httpx2>=2.16.0",
]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
line_length = 79

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src --cov-report=term-missing"
env = [
    "AWS_ACCESS_KEY_ID=testing",
    "AWS_SECRET_ACCESS_KEY=testing",
    "AWS_REGION=ap-southeast-2",
    "AWS_DEFAULT_REGION=ap-southeast-2",
    "TABLE_NAME=messages",
    "WRITE_KEY_PARAMETER=/test/write-key",
    "READ_KEY_PARAMETER=/test/read-key",
    "POWERTOOLS_SERVICE_NAME=simple-message-webhook",
]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"

[tool.pylint.main]
init-hook = "import sys; sys.path.append('src')"

[tool.numpydoc_validation]
checks = [
    "all",   # report on all checks, except the below
    "EX01",  # don't require "Examples" section
    "SA01",  # don't require "See Also" section
    "ES01",  # don't require extended summary
]
exclude = [
    "\\.__init__$",
]
